# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: compatibility
    - id: community-market
      name: dsh-community-market
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    # Avti owns no signed update channel yet. Keep the upstream DSH updater fully disabled
    # so an Avti build cannot check or download installers from dshdesktop.cn.
    - id: desktop-updates
      name: dsh-plugin-desktop/updates
      disabled: true

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# ClaudeGravity exposes its local Antigravity proxy through the Anthropic
# Messages protocol. The proxy must be running before this route is used.
- id: llm-pi-ai
  config:
    providers:
      claudegravity:
        displayName: ClaudeGravity
        api: anthropic-messages
        baseURL: http://127.0.0.1:8080
        headers:
          x-api-key: antigravity
        models:
          - id: gemini-3.6-flash-high
            contextWindow: 1000000
          - id: claude-sonnet-4-6
            contextWindow: 1000000
          - id: gemini-2.5-pro
            contextWindow: 2000000
          - id: claude-opus-4-6-thinking
            contextWindow: 1000000
          - id: gemini-2.5-flash
            contextWindow: 1000000
          - id: gemini-2.5-flash-lite
            contextWindow: 1000000
          - id: gemini-2.5-flash-thinking
            contextWindow: 1000000
